appId: com.recreatedos.devlog
productName: Devlog
copyright: © 2026 ReCreatedOS

directories:
  output: release
  buildResources: build

# İmzalama atlandığında paket geçersiz imzayla kalıyor; hook ad-hoc imzalıyor.
afterPack: build/after-pack.mjs

# Ana süreç ve preload rollup ile tek dosyaya bundle ediliyor, `dependencies`
# boş — bu yüzden pakete node_modules KOPYALANMIYOR. Uygulama ~200MB yerine
# yalnız Electron çalışma zamanı + kendi kodumuz kadar yer tutuyor.
files:
  - out/**
  - package.json

asar: true

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  darkModeSupport: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Kod imzalama YOK — kişisel kullanım, Apple Developer üyeliği gerektirmiyor.
  # Yerel derlemede karantina bayrağı konmadığı için uygulama doğrudan açılır;
  # başka bir makineye indirilirse sağ tık → Aç gerekir (bkz. README).
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.exe

linux:
  target: []
